# ---------------------------------------------------------------------------- #
#                                    BASICS                                    #
# ---------------------------------------------------------------------------- #
experiment_name: ElectrictyCheck
environment: Eplus-1Zone-NoThermostat-v1
episodes: 5
# timestep = 6

# ---------------------------------------------------------------------------- #
#                                 SB3 ALGORITHM                                #
# ---------------------------------------------------------------------------- #
algorithm:
  name: stable_baselines3:PPO
  log_interval: 1
  parameters:
    policy: MlpPolicy
    learning_rate: 2e-4
    n_steps: 4096
    batch_size: 128
    n_epochs: 15
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.25
    clip_range_vf: null
    normalize_advantage: true
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    use_sde: false
    sde_sample_freq: -1
    # rollout_buffer_class: my_rollout_buffer:LeftShiftPadRightRolloutBuffer
    # rollout_buffer_kwargs:
    #   delay: 3
    target_kl: 0.02
    stats_window_size: 100
    tensorboard_log: logs/tensorboard/
    verbose: 1
    seed: null
    device: cuda:1
    _init_setup_model: true

# ---------------------------------------------------------------------------- #
#                             INITIAL STATE (MODEL)                            #
# ---------------------------------------------------------------------------- #

# -------------------------------- Local Path -------------------------------- #
# model: 
#   local_path: </path/to/model>

# ---------------------------- Google Bucket Path ---------------------------- #
# model: 
#   bucket_path: gs://<path_to_model_google_bucket>

# ----------------------------- WANDB model Path ----------------------------- #
model:
  project: PPO-greenhouse-sanityTests
  entity: sarazewial19-carnegie-mellon-university
  artifact_name: ppo_greenhouse_model
  artifact_type: model
  artifact_tag: v0
  artifact_path: Sinergym_output/
  model_path: Sinergym_output/model.zip

# ---------------------------------------------------------------------------- #
#                                  EVALUATION                                  #
# ---------------------------------------------------------------------------- #
evaluation:
  eval_freq: 10
  eval_length: 1

# ---------------------------------------------------------------------------- #
#                       ENVIRONMENT OVERWRITE PARAMETERS                       #
# ---------------------------------------------------------------------------- #
# Yaml file with environment configuration (Optional)
env_yaml_config: null
# In order to overwrite some parameters of the environment, you can use the following
env_params:
  seed: null
  reward: sinergym.utils.rewards:ComfortGatedReward
  reward_kwargs: 
    energy_variables:
      - total_energy
    temperature_variables:
      - indoor_temperature
    range_comfort_winter: [18, 23]
    range_comfort_summer: [18, 23]  
    energy_weight: 0.4
    # Two-stage temperature reward shape
    M: 1.0
    eta: 0.2          # was 0.2 → gentler edge slope → less actuator chatter
    delta: 0.8         # was 1.0 → wider “flat” comfort core to stabilize near-band behavior
    K: 6.0             # was 5.0 → farther saturation → stronger pull only when clearly off-band

    # Comfort-gated energy
    lambda_energy: 0.4   # was 0.5 → prioritize comfort early; add energy pressure but not dominant
    c: 10.0                # was 10.0 → mildness decays a bit sooner on harsh days
    p: 2.2                # was 2.0 → slightly smoother decay curve

    # Adaptive energy normalization (per-bin EMA)
    alpha: 0.03           # was 0.02 → stats adapt ~2× faster (≈ 4–5 hours half-life at 10-min steps)
    k: 2.0               # was 2.0 → wider tolerance band; less noisy energy gradients early on
    difficulty_bins: [0.0, 1.5, 4.0, 8.0]   # was [0,2,5,10] → finer resolution in the “hard but common” range
    epsilon: 1e-8         # was 1e-9 → a bit more numerical cushion AT_DA_Doha.404280_TMYx.2007-2021.epw'
  weather_files: 'QAT_DA_Doha.404280_TMYx.2007-2021.epw'
  building_file: 'greenhouse_triangle_2CoolLoop_Heater.epJSON'
  meters:
    hvac_electricity: 'Electricity:HVAC'
  variables:
    total_energy: ['Facility Total HVAC Electricity Demand Rate','whole building']
    outdoor_temperature: ['Site Outdoor Air Drybulb Temperature', 'Environment']
    
    indoor_temperature: ['Zone Mean Air Temperature', 'Greenhouse Zone Roof']
    indoor_humidity: ['Site Outdoor Air Relative Humidity', 'Environment']
    outdoor_humidity: ['Site Outdoor Air Relative Humidity', 'Environment']

    # htg_setpoint: ['Zone Thermostat Heating Setpoint Temperature', 'Greenhouse Zone Roof']
    # clg_setpoint: ['Zone Thermostat Cooling Setpoint Temperature', 'Greenhouse Zone Roof']
    
    CoolFan_Electricity_Rate: ["Fan Electricity Rate","Supply Fan"]
    
    D_Cooler_Electricity_Rate: ["Evaporative Cooler Electricity Rate", "Evaporative Cooler"]
    D_Cooler_WB_eff: ["Evaporative Cooler Wet Bulb Effectiveness", "Evaporative Cooler"]
    D_Cooler_Wtr_Vol: ["Evaporative Cooler Water Volume", "Evaporative Cooler"]
    D_Cooler_Mains_Wtr: ["Evaporative Cooler Mains Water Volume", "Evaporative Cooler"]

    ID_Cooler_Electricity_Rate: ["Evaporative Cooler Electricity Rate", "Indirect Evaporative Cooler"]
    ID_Cooler_WB_eff: ["Evaporative Cooler Wet Bulb Effectiveness", "Indirect Evaporative Cooler"]
    ID_Cooler_Wtr_Vol: ["Evaporative Cooler Water Volume", "Indirect Evaporative Cooler"]
    ID_Cooler_Mains_Wtr: ["Evaporative Cooler Mains Water Volume", "Indirect Evaporative Cooler"]

    HeaterFan_Electricity_Rate: ["Fan Electricity Rate", "Heater Fan"]
    HeaterCoil_Electricity_Rate: ["Heating Coil Electricity Rate", "Roof Heater Coil"]

    Cool_Fan_Air_Mass_Flow:  ["Fan Air Mass Flow Rate", "Supply Fan"]
    Heater1_Fan_Air_Mass_Flow: ["Fan Air Mass Flow Rate", "Heater Fan"]

  actuators:
    FanFlow_WAC1:  ["Fan", "Fan Air Mass Flow Rate", "Supply Fan"]
    FanFlow_Heat1: ["Fan", "Fan Air Mass Flow Rate", "Heater Fan"]
  
  action_space: 
    gym.spaces.Box(
        low  = np.array([0, 0]),
        high = np.array([12, 12]),
        dtype=np.float32
      )

# ---------------------------------------------------------------------------- #
