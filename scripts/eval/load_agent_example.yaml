# ---------------------------------------------------------------------------- #
#                                    BASICS                                    #
# ---------------------------------------------------------------------------- #
experiment_name: Eplus-PPO-load-example
environment: Eplus-5zone-hot-continuous-stochastic-v1
episodes: 5

# ---------------------------------------------------------------------------- #
#                                   ALGORITHM                                  #
# ---------------------------------------------------------------------------- #
algorithm:
  name: stable_baselines3:PPO

# ---------------------------------------------------------------------------- #
#                         MODEL TO EVALUATE (REQUIRED)                         #
# ---------------------------------------------------------------------------- #

# -------------------------------- Local Path -------------------------------- #
# model: 
#   local_path: </path/to/model>

# ---------------------------- Google Bucket Path ---------------------------- #
# model: 
#   bucket_path: gs://<path_to_model_google_bucket>

# ----------------------------- WANDB model Path ----------------------------- #
model:
  project: PPPO-greenhouse-Training
  entity: sarazewail19-carnegie-mellon-university
  artifact_name: ppo_greenhouse_model
  artifact_type: model
  artifact_tag: v0         # or "latest"
  artifact_path: Sinergym_output/
  model_path: Sinergym_output/model.zip

# ---------------------------------------------------------------------------- #
#                       ENVIRONMENT OVERWRITE PARAMETERS                       #
# ---------------------------------------------------------------------------- #
# Yaml file with environment configuration (Optional)
env_yaml_config: Sinergym_output/env_config.pyyaml
# Environment deep update for parameters with dictionary type, it is used to overwrite the environment parameters default is True).
env_deep_update: true
# In order to overwrite some parameters of the environment, you can use the following
env_params:
  seed: null
# reward: sinergym.utils.rewards:LinearReward
# ... other environment parameters

# ---------------------------------------------------------------------------- #
#                              WRAPPERS DEFINITION                             #
# ---------------------------------------------------------------------------- #
# Yaml file with wrappers configuration (Optional)
wrappers_yaml_config: Sinergym_output/wrappers_config.pyyaml
# This overwrite wrappers in wrappers_yaml_config if defined
wrappers:
  - sinergym.utils.wrappers:BuildStateWrapper: {}
  - sinergym.utils.wrappers:LaggedObservationWrapper: {
        lagged_variables: ['total_electricity_HVAC', 'indoor_temperature', 'outdoor_temperature'], 
        n_lags: 3}
  - sinergym.utils.wrappers:LoggerWrapper:
      storage_class: sinergym.utils.logger:LoggerStorage
  - sinergym.utils.wrappers:CSVLogger: {}
  - sinergym.utils.wrappers:WandBLogger:
      entity: sarazewial19-carnegie-mellon-university
      project_name: PPPO-greenhouse-Training


# -------------------------- GOOGLE CLOUD (OPTIONAL) ------------------------- #
# cloud: 
#   remote_store: null # remote bucket name
#   auto_delete: null # Delete remote instance when finish experiment
  # auto_delete:
  #   group_name: group-example
